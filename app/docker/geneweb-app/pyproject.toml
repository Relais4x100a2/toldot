[project]
name = "geneweb-app"
version = "0.2.0"
description = "Application Streamlit pour le traitement de données généalogiques avec IA"
license = {text = "MIT"}
authors = [
    {name = "Guillaume Cayeux", email = "guillaume@example.com"},
]
dependencies = [
    "geneweb-py",
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "plotly>=5.15.0",
    "dspy-ai>=2.4.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.3.0",
    "jsonlines>=4.0.0",
]
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

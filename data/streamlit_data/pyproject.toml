[project]
name = "geneweb-revamped"
version = "0.1.0"
description = "Application Streamlit pour traiter les fichiers GeneWeb via LLM"
authors = [
    {name = "Guillaume Cayeux"}
]
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.28.0",
    "requests>=2.31.0",
    "protobuf>=4.21.0,<5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

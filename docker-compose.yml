version: '3.8'

services:
  geneweb-server:
    build:
      context: ./docker/geneweb-server
      dockerfile: Dockerfile
    container_name: geneweb-server
    ports:
      - "2316:2316"  # gwsetup
      - "2317:2317"  # gwd
    volumes:
      - ${GENEWEB_BASES_HOST_DIR:-./data/geneweb_bases}:/opt/geneweb/bases
      - ./data/geneweb_config:/opt/geneweb/config
    networks:
      - geneweb-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2317"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  geneweb-app:
    build:
      context: ./docker/geneweb-app
      dockerfile: Dockerfile
    container_name: geneweb-app
    ports:
      - "8501:8501"
    volumes:
      - ${GENEWEB_BASES_HOST_DIR:-./data/geneweb_bases}:/opt/geneweb/bases
      - ./data/training:/opt/geneweb/data/training
      - ./docker/geneweb-app:/app
    environment:
      # Charger depuis le fichier .env
      - API_KEY_OPENROUTER=${API_KEY_OPENROUTER}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-anthropic/claude-3.5-sonnet}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_APP_NAME=${OPENROUTER_APP_NAME:-geneweb-ai-processor}
      - OPENROUTER_SITE_URL=${OPENROUTER_SITE_URL:-http://localhost:8501}
      - DATA_DIR=/opt/geneweb/data/training
      - GENEWEB_BASES_DIR=/opt/geneweb/bases
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_TELEMETRY=false
    networks:
      - geneweb-network
    depends_on:
      geneweb-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  geneweb-network:
    driver: bridge

volumes:
  geneweb-data:
  training-data:

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" role="img" aria-labelledby="t d">
  <title id="t">Chaîne de traitement TOLDOT</title>
  <desc id="d">Fichier .gw, puis parser, modèle objet, règles, LLM optionnel, et enfin réseau et exports.</desc>
  <!-- Illustration originale, dédiée au domaine public (CC0 1.0). -->
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6b7a"/></marker></defs>
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">
    <g fill="#f4efe1" stroke="#b9a977" stroke-width="2">
      <rect x="10" y="60" width="120" height="80" rx="10"/>
    </g>
    <text x="70" y="96" fill="#3a3320" font-weight="bold">base.gw</text><text x="70" y="116" fill="#3a3320" font-size="12">source intacte</text>
    <g fill="#dfeaf3" stroke="#5f8db3" stroke-width="2">
      <rect x="170" y="60" width="120" height="80" rx="10"/><rect x="330" y="60" width="120" height="80" rx="10"/>
    </g>
    <text x="230" y="96" fill="#1f3a5f" font-weight="bold">Parser</text><text x="230" y="116" fill="#1f3a5f" font-size="12">lexer · syntaxe</text>
    <text x="390" y="96" fill="#1f3a5f" font-weight="bold">Modèle objet</text><text x="390" y="116" fill="#1f3a5f" font-size="12">personnes · familles</text>
    <g fill="#e1f1ec" stroke="#4f9d8a" stroke-width="2">

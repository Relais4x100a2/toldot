    <text x="550" y="140" fill="#1d5a4c" font-weight="bold">LLM</text><text x="550" y="158" fill="#1d5a4c" font-size="12">optionnel · DSPy</text>
    <g fill="#f6e4e4" stroke="#b86a6a" stroke-width="2"><rect x="650" y="60" width="120" height="80" rx="10"/></g>

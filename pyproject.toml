[project]
name = "toldot-workspace"
version = "0.1.0"
description = "Monorepo TOLDOT : moteur geneweb-py (core/) et application LLM (app/)"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["core", "app/docker/geneweb-app"]

# Les membres du workspace se résolvent entre eux, sans chemin relatif
[tool.uv.sources]
geneweb-py = { workspace = true }
